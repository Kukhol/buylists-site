<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    var path = window.location.pathname;

    // Only redirect list routes
    if (path.startsWith('/buylists-site/list/')) {
      var newUrl = '/buylists-site/list/index.html?path=' + encodeURIComponent(path);
      window.location.replace(newUrl);
    }
  </script>
</head>
<body></body>
</html>
