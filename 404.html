<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
  const path = window.location.pathname;

  // Extract list ID
  const segments = path.split('/').filter(Boolean);
  const listId = segments[segments.length - 1];

  if (listId && listId !== 'index.html') {
    // Redirect to app with ID
    window.location.href = `buylists://list/${listId}`;
  } else {
    // fallback
    window.location.href = "/";
  }
</script>
</head>
<body></body>
</html>
