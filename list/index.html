<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Opening BuyLists...</title>

  <script>
    const path = window.location.pathname; 
    const id = path.split("/").pop();

    const appUrl = "buylists://list/" + id;

    // Try opening app
    window.location.href = appUrl;

    // Fallback if app not installed
    setTimeout(() => {
      window.location.href = "https://play.google.com/store/apps/details?id=com.kukholapps.buylists";
    }, 2000);
  </script>

  <style>
    body {
      background: linear-gradient(135deg, #0f766e, #065f46);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
    }
  </style>
</head>

<body>
  <h2>Opening your grocery list...</h2>
</body>
</html>
