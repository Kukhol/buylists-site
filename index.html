<!DOCTYPE html>
<html>
<head>
  <!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
function openApp() {
    const params = new URLSearchParams(window.location.search);

    let path = params.get('path');

    // If coming from 404 redirect
    if (path) {
        const parts = path.split('/');
        var listId = parts[parts.length - 1];
    } else {
        // Normal direct open
        const parts = window.location.pathname.split('/');
        var listId = parts[parts.length - 1];
    }

    // Safety fallback
    if (!listId || listId === 'index.html') {
        document.body.innerHTML = "<h2>Invalid link</h2>";
        return;
    }

    const appUrl = "buylists://list/" + listId;

    window.location.href = appUrl;

    setTimeout(() => {
        window.location.href = "https://play.google.com/store/apps/details?id=com.kukholapps.buylists";
    }, 1500);
}

window.onload = openApp;
</script>
</head>
<body></body>
</html>
</head>

</html>
