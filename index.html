<!DOCTYPE html>
<html>
<head>
  <!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
function extractListId() {
    const params = new URLSearchParams(window.location.search);
    const redirectPath = params.get('path');

    let path = redirectPath || window.location.pathname;

    // Normalize path
    path = path.replace(/\/+$/, ''); // remove trailing slash

    const parts = path.split('/');

    // Find 'list' and take next segment
    const listIndex = parts.indexOf('list');

    if (listIndex !== -1 && parts.length > listIndex + 1) {
        return parts[listIndex + 1];
    }

    return null;
}

function openApp() {
    const listId = extractListId();

    if (!listId) {
        console.error("Invalid list ID");
        return;
    }

    const appUrl = buylists://list/${listId};

    console.log("Opening:", appUrl);

    window.location.href = appUrl;

    // Fallback
    setTimeout(() => {
        window.location.href = "https://play.google.com/store/apps/details?id=com.kukholapps.buylists";
    }, 1500);
}

// Auto-open
window.onload = function () {
    openApp();
};
</script>
</head>
<body></body>
</html>
</head>
<body></body>
</html>
