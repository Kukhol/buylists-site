<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Opening BuyLists...</title>

  <script>
    function openApp() {
      const path = window.location.pathname;
      const segments = path.split('/').filter(Boolean);
      const listId = segments[segments.length - 1];

      if (!listId) return;

      // Try opening app
      window.location.href = "buylists://list/" + listId;

      // Fallback after delay
      setTimeout(() => {
        window.location.href =
          "https://play.google.com/store/apps/details?id=com.kukholapps.buylists";
      }, 1500);
    }

    window.onload = openApp;
  </script>
</head>

<body style="font-family:sans-serif;text-align:center;margin-top:100px;">
  <h2>Opening your list...</h2>
  <p>If nothing happens, <a id="manual">tap here</a></p>

  <script>
    const path = window.location.pathname;
    const segments = path.split('/').filter(Boolean);
    const listId = segments[segments.length - 1];

    document.getElementById("manual").href =
      "buylists://list/" + listId;
  </script>
</body>
</html>
