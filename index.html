<!DOCTYPE html>
<html>
<head>
  <script>
    // Redirect all routes to index.html while preserving path
    const path = window.location.pathname;
    const search = window.location.search;

    window.location.replace(
      '/buylists-site/list/index.html?redirect=' + encodeURIComponent(path + search)
    );
  </script>
</head>
<body></body>
</html>
